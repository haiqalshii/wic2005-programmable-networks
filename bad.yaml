# bad.yaml — topology.yaml with deliberate mistakes, to prove check() catches them:
#   h4 reuses h3's IPv4 and IPv6 addresses, and a link goes to s9, which doesn't exist.
#
# build_topo.py reads this file and creates exactly this network in Mininet.
#
# Design: a two-tier tree. s1 is the core switch; s2 and s3 are edge switches
# that each hang off s1. Two hosts sit on each switch. There are no loops
# (LinuxBridge here runs without STP), and every host reaches every other via s1.
#
#            h1   h2
#             \   /
#              s1
#             /   \
#           s2     s3
#          /  \   /  \
#         h3  h4 h5  h6
#
# Don't put your full student ID here: this file goes in your repository,
# which may be public.

student_id_last4: "1995"

switches:
  - s1
  - s2
  - s3

hosts:
  - name: h1
    ip: 10.95.0.1/24
    ipv6: fd00:1995::1/64
  - name: h2
    ip: 10.95.0.2/24
    ipv6: fd00:1995::2/64
  - name: h3
    ip: 10.95.0.3/24
    ipv6: fd00:1995::3/64
  - name: h4
    ip: 10.95.0.3/24
    ipv6: fd00:1995::3/64
  - name: h5
    ip: 10.95.0.5/24
    ipv6: fd00:1995::5/64
  - name: h6
    ip: 10.95.0.6/24
    ipv6: fd00:1995::6/64

# Each link joins two nodes.
links:
  - [h1, s1]
  - [h2, s1]
  - [h3, s2]
  - [h4, s2]
  - [h5, s3]
  - [h6, s3]
  - [s1, s2]
  - [s1, s3]
  - [s3, s9]
